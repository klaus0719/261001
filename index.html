<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>城市散步</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>城市散步</h1>
      <nav>
        <a href="#event">活動資訊</a>
        <a href="#signup">立即報名</a>
      </nav>
    </header>

    <main>
      <section id="event">
        <h2>活動資訊</h2>
        <p>一起在城市街道中慢步，探索美食、文化與景點。</p>
      </section>

      <section id="signup">
        <h2>立即報名</h2>
        <form>
          <label for="name">姓名：</label>
          <input type="text" id="name" name="name" />
          <button type="submit">送出</button>
        </form>
      </section>
    </main>

    <footer>
      <p>© 2026 城市散步</p>
    </footer>
  </body>
</html>
